# Render.com blueprint for the single-container ScoutBox build.
# Connect the repo in the Render dashboard and it picks this up.
services:
  - type: web
    name: scoutbox
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: scoutbox-data
      mountPath: /srv/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Production refuses to boot without these two (scoutbox-server/src/scoutbox/platform/config.gleam).
      # Render generates a random value for each; read ADMIN_KEY in the dashboard.
      - key: ADMIN_KEY
        generateValue: true
      - key: MEDIA_SECRET
        generateValue: true
      # A first production boot starts with no people or clubs. For a hosted
      # demo, add SCOUTBOX_SEED_DEMO=1 before the first deploy, then give the
      # demo clubs passwords with POST /admin/clubs/:id/credentials. Without the
      # demo world, set TS_REVIEWER_BOOTSTRAP_ID, _SECRET (12+ characters) and
      # _NAME for the first Trust & Safety reviewer, created at boot if no
      # reviewer has that id and never changed from the settings after.
      # Optional live providers, set in the dashboard to switch the adapters:
      # SENDGRID_API_KEY, EXPO_ACCESS_TOKEN, and the four R2 settings (R2_ACCOUNT_ID,
      # R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) for uploads in Cloudflare R2;
      # without them uploaded files are kept on the disk (/srv/data/media).
