# Render.com blueprint for the single-container ScoutBox build.
# Connect the repo in the Render dashboard and it picks this up.
services:
  - type: web
    name: scoutbox
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: scoutbox-data
      mountPath: /srv/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Production refuses to boot without these two (m181/capabilities.mjs).
      # Render generates a random value for each; read ADMIN_KEY in the dashboard.
      - key: ADMIN_KEY
        generateValue: true
      - key: MEDIA_SECRET
        generateValue: true
      # A first production boot starts with no people or clubs. For a hosted
      # demo, add SCOUTBOX_SEED_DEMO=1 before the first deploy, then give the
      # demo clubs passwords with POST /admin/clubs/:id/credentials.
      # Optional live providers, set in the dashboard to switch the adapters:
      # SENDGRID_API_KEY, EXPO_ACCESS_TOKEN
