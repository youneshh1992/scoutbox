name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  format:
    name: Formatting (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Every file is Biome-formatted (fix locally with `npm run format`)
        run: npm run format:check

  server:
    name: Server — unit tests + API end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-server/package-lock.json
      - run: npm ci
      - name: Domain unit tests
        run: npm test
      - name: End-to-end batteries (scripts/runE2E.mjs; each boots its own servers on temporary data dirs)
        run: npm run e2e

  club:
    name: Club app — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-club
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-club/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Demo build (artifact mode)
        run: VITE_DEMO=1 npx vite build

  player:
    name: Player app — typecheck + web export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-player/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Player unit tests (Jest, jest-expo)
        run: npm test -- --runInBand
      - run: npx expo export --platform web --output-dir dist-ci

  admin:
    name: T&S console — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  grassroots:
    name: Grassroots app — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-grassroots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-grassroots/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Demo build (artifact mode)
        run: VITE_DEMO=1 npx vite build

  agent:
    name: Agent app — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-agent/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Demo build (artifact mode)
        run: VITE_DEMO=1 npx vite build
