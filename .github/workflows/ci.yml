name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    name: Server — unit tests + API end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-server/package-lock.json
      - run: npm ci
      - name: Domain unit tests
        run: npm test
      - name: API end-to-end (fresh seed)
        run: |
          rm -rf data
          node server.mjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf http://localhost:4000/orgs/directory >/dev/null && break; sleep 1; done
          npm run e2e
          kill $SERVER_PID
      - name: Connected-mode end-to-end (isolated servers, SIGKILL durability, prod gate)
        run: node scripts/connectedE2E.mjs
      - name: Migrated-domain end-to-end batteries (each spawns its own server)
        # The batteries that pass on the current tree (s8c-readiness-review.md §14; m23SigningPersistence joined at
        # S8d, its fixture fixed). Three fail identically on the accepted 7072dd9 tree and today (m23Persistence,
        # m23BootContract, m23AgentTransactionPersistence): pre-existing defects to fix before they join this step,
        # not to skip here.
        run: |
          for s in m13E2E m23ContactPersistence m23OfferPersistence m23DecisionPersistence m23TrialPersistence m23RecruitmentJourneyPersistence m23SigningPersistence; do
            echo "== $s"; node "scripts/$s.mjs" || exit 1
          done

  club:
    name: Club app — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-club
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-club/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Demo build (artifact mode)
        run: VITE_DEMO=1 npx vite build

  player:
    name: Player app — typecheck + web export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-player/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Player unit tests (Jest, jest-expo)
        run: npm test -- --runInBand
      - run: npx expo export --platform web --output-dir dist-ci

  admin:
    name: T&S console — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  grassroots:
    name: Grassroots app — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-grassroots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-grassroots/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Demo build (artifact mode)
        run: VITE_DEMO=1 npx vite build

  agent:
    name: Agent app — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoutbox-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoutbox-agent/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Demo build (artifact mode)
        run: VITE_DEMO=1 npx vite build
